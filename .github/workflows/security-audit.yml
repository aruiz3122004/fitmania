name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Revisión semanal (lunes 12:00 UTC) ante nuevas advisories.
    - cron: '0 12 * * 1'

jobs:
  npm-audit:
    name: npm audit (producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ejecuta TypeScript nativo en las pruebas (node --test)
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # F1-01 / F1-27: tipos y pruebas de la lógica de seguridad (puerta de paneles,
      # pase firmado, validación de campos del admin, IP confiable).
      - name: Verificación de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      # T-13 / F1-30: el build FALLA si hay vulnerabilidades ALTAS o CRÍTICAS
      # en dependencias de producción. Las moderadas se reportan aparte.
      - name: Auditoría crítica de producción
        run: npm audit --omit=dev --audit-level=high

      # Reporte informativo (no rompe el build) con el detalle de prod.
      - name: Reporte completo (informativo)
        if: always()
        run: npm audit --omit=dev || true
