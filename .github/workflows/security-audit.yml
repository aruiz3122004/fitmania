name: CI (tipos, pruebas, lint, build, E2E y auditoría)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Revisión semanal (lunes 12:00 UTC) ante nuevas advisories.
    - cron: '0 12 * * 1'

jobs:
  npm-audit:
    name: npm audit (producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ejecuta TypeScript nativo en las pruebas (node --test)
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # F1-01 / F1-27: tipos y pruebas de la lógica de seguridad (puerta de paneles,
      # pase firmado, validación de campos del admin, IP confiable).
      - name: Verificación de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      # Reglas de Firestore contra el emulador (proyecto `demo-`, nunca el real).
      # El emulador es un .jar: necesita Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pruebas de reglas de Firestore
        run: npm run test:rules

      # Errores de lint rompen la CI; los avisos (deuda conocida: `any`, reglas del
      # React Compiler) solo se reportan. Ver eslint.config.mjs.
      - name: Lint
        run: npm run lint

      # Compila como en Vercel. Las variables públicas son ficticias: el build no se
      # conecta a Firebase, solo necesita que la configuración exista.
      - name: Build de producción
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          NEXT_TELEMETRY_DISABLED: '1'

      # Pruebas de navegador (escritorio y móvil) sobre el build anterior. Solo páginas
      # que no dependen de datos reales; los flujos con login irán contra staging.
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Modo sandbox de punta a punta contra los emuladores de Firebase (nunca un
      # proyecto real): compila aparte en .next-sandbox con sus variables públicas.
      - name: Pruebas E2E del modo sandbox
        run: npm run test:e2e:sandbox

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-sandbox/
          retention-days: 7

      # T-13 / F1-30: el build FALLA si hay vulnerabilidades ALTAS o CRÍTICAS
      # en dependencias de producción. Las moderadas se reportan aparte.
      - name: Auditoría crítica de producción
        run: npm audit --omit=dev --audit-level=high

      # Reporte informativo (no rompe el build) con el detalle de prod.
      - name: Reporte completo (informativo)
        if: always()
        run: npm audit --omit=dev || true
